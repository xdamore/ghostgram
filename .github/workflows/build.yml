name: CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '1'

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Setup User Codesigning
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          PROV_PROFILE_BASE64: ${{ secrets.PROV_PROFILE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          rm -rf "$SOURCE_DIR/build-system/user-codesigning"
          mkdir -p "$SOURCE_DIR/build-system/user-codesigning/certs"
          mkdir -p "$SOURCE_DIR/build-system/user-codesigning/profiles"

          echo "$CERT_P12_BASE64" | tr -d '[:space:]' | base64 --decode > /tmp/raw.p12
          echo "$PROV_PROFILE_BASE64" | tr -d '[:space:]' | base64 --decode > "$SOURCE_DIR/build-system/user-codesigning/profiles/Telegram.mobileprovision"
          CLEAN_PASS=$(printf "%s" "$CERT_PASSWORD" | tr -d '\r\n')

          openssl pkcs12 -in /tmp/raw.p12 -passin "pass:$CLEAN_PASS" -nodes -out /tmp/key.pem -legacy || openssl pkcs12 -in /tmp/raw.p12 -passin "pass:$CLEAN_PASS" -nodes -out /tmp/key.pem
          openssl pkcs12 -export -in /tmp/key.pem -out "$SOURCE_DIR/build-system/user-codesigning/certs/cert.p12" -passout "pass:$CLEAN_PASS" -legacy || openssl pkcs12 -export -in /tmp/key.pem -out "$SOURCE_DIR/build-system/user-codesigning/certs/cert.p12" -passout "pass:$CLEAN_PASS"

          security create-keychain -p "buildpass" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "buildpass" build.keychain
          security import "$SOURCE_DIR/build-system/user-codesigning/certs/cert.p12" -k build.keychain -P "$CLEAN_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "buildpass" build.keychain
          security find-identity -v -p codesigning build.keychain

          security cms -D -i "$SOURCE_DIR/build-system/user-codesigning/profiles/Telegram.mobileprovision" > /tmp/prof.plist
          TEAM_ID=$(python3 -c "import plistlib; print(plistlib.load(open('/tmp/prof.plist','rb'))['TeamIdentifier'][0])")
          FULL_APP_ID=$(python3 -c "import plistlib; print(plistlib.load(open('/tmp/prof.plist','rb'))['Entitlements']['application-identifier'])")
          APP_GROUP=$(python3 -c "import plistlib; print(plistlib.load(open('/tmp/prof.plist','rb'))['Entitlements']['com.apple.security.application-groups'][0])")

          REAL_BUNDLE_ID="${FULL_APP_ID#*.}"
          if [[ "$REAL_BUNDLE_ID" == *"*"* ]]; then
            REAL_BUNDLE_ID="${REAL_BUNDLE_ID//\*/ghostgram}"
          fi

          python3 -c "
          import json
          p = '$SOURCE_DIR/build-system/appstore-configuration.json'
          d = json.load(open(p))
          d['team_id'] = '$TEAM_ID'
          d['bundle_id'] = '$REAL_BUNDLE_ID'
          json.dump(d, open(p, 'w'), indent=2)
          "

          APP_GROUP="$APP_GROUP" python3 -c '
          import glob, re, os
          app_group = os.environ["APP_GROUP"]
          genrule = "genrule(name = \"copy_prof\", outs = [\"Telegram.mobileprovision\"], cmd = \"cp /Users/Shared/telegram-ios/build-system/user-codesigning/profiles/Telegram.mobileprovision $@\", visibility = [\"//visibility:public\"])"
          for path in glob.glob("/Users/Shared/telegram-ios/build-system/Make/*.py"):
              txt = open(path).read()
              if "Could not find a valid aps-environment" in txt:
                  txt = txt.replace("Could not find a valid aps-environment", "IGNORE_APS_CHECK")
                  txt = txt.replace("sys.exit(1)", "pass")
              if "exports_files(" in txt and "provisioning" in txt:
                  txt = re.sub(r"exports_files\(\s*\[[^\]]*\][^)]*\)", genrule, txt, flags=re.DOTALL)
              txt = txt.replace("\"--apple_generate_dsym\",", "")
              txt = txt.replace("\"--output_groups=+dsyms\",", "")
              open(path, "w").write(txt)
          bad_exts = ["BroadcastUploadExtension", "NotificationContentExtension", "NotificationServiceExtension", "ShareExtension", "WidgetExtension", "SiriIntentsExtension", "IntentsExtension", "WatchApp"]
          for path in glob.glob("/Users/Shared/telegram-ios/Telegram/**", recursive=True):
              if path.endswith("BUILD") or path.endswith(".plist") or path.endswith(".entitlements"):
                  try:
                      txt = open(path).read()
                      new_txt = re.sub(r"@build_configuration//provisioning:[A-Za-z0-9_.-]+\.mobileprovision", "@build_configuration//provisioning:Telegram.mobileprovision", txt)
                      new_txt = re.sub(r"\"group\.[A-Za-z0-9_.*{}-]+\"", "\"" + app_group + "\"", new_txt)
                      new_txt = re.sub(r">group\.[A-Za-z0-9_.*{}-]+<", ">" + app_group + "<", new_txt)
                      new_txt = re.sub(r"\"group\.\"\s*\+\s*[A-Za-z0-9_.]+", "\"" + app_group + "\"", new_txt)
                      if path.endswith("/Telegram/BUILD"):
                          lines = new_txt.splitlines()
                          filtered = [l for l in lines if not any(f":{b}\"" in l or f"/{b}\"" in l for b in bad_exts)]
                          new_txt = "\n".join(filtered) + "\n"
                      if new_txt != txt:
                          open(path, "w").write(new_txt)
                  except Exception:
                      pass
          wc = "/Users/Shared/telegram-ios/submodules/Display/Source/WindowContent.swift"
          if os.path.exists(wc):
              lines = open(wc).readlines()
              open(wc, "w").writelines(["        return nil\n" if "reservedRegions" in l else l for l in lines])
          for bpath in ["/Users/Shared/telegram-ios/Ghostgram/GGSettingsUI/BUILD", "/Users/Shared/telegram-ios/submodules/TelegramUI/Components/ShareScreen/BUILD"]:
              if os.path.exists(bpath):
                  btxt = open(bpath).read()
                  btxt = btxt.replace("copts = [", "copts = [\"-Onone\", ")
                  open(bpath, "w").write(btxt)
          '

      - name: Build the App (Fake Signing)
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          sudo rm -rf "$BAZEL_USER_ROOT"
          cd $SOURCE_DIR

          # Ограничения памяти
          echo "build --jobs=1" >> .bazelrc
          echo "build --local_resources=memory=6144" >> .bazelrc
          echo "build --define=apple.experimental.tree_artifact_outputs=0" >> .bazelrc

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"

          # КЛЮЧЕВЫЕ ИЗМЕНЕНИЯ: Используем fake-codesigning и отключаем профили
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --disableProvisioningProfiles \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          
          # Ищем готовый .ipa
          IPA_PATH=$(find bazel-out -name "*.ipa" | head -n 1)
          
          if [ -n "$IPA_PATH" ]; then
              echo "Found IPA at $IPA_PATH"
              cp "$IPA_PATH" "$OUTPUT_PATH/GhostGram.ipa"
          else
              # Если .ipa нет (из-за фейковой подписи), пакуем .app вручную
              echo "IPA not found. Searching for .app bundle to package manually..."
              APP_PATH=$(find bazel-out -type d -name "Ghostgram.app" | head -n 1)
              if [ -z "$APP_PATH" ]; then
                  APP_PATH=$(find bazel-out -type d -name "Telegram.app" | head -n 1)
              fi
              
              if [ -n "$APP_PATH" ]; then
                  echo "Found APP at $APP_PATH"
                  mkdir -p /tmp/Payload
                  cp -R "$APP_PATH" /tmp/Payload/
                  cd /tmp
                  zip -r "$SOURCE_DIR/$OUTPUT_PATH/GhostGram.ipa" Payload
              else
                  echo "Error: Could not find .app or .ipa in bazel-out"
                  exit 1
              fi
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostGram-Unsigned-IPA
          path: /Users/Shared/telegram-ios/build/artifacts/GhostGram.ipa
